<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Entry Operator — Portfolio & Daily Work</title>
<meta name="description" content="Professional work portfolio and daily work blog of a Data Entry Operator. Daily data entry posts, Excel projects, screenshots, links and resources.">
<meta property="og:title" content="Data Entry Operator — Portfolio & Daily Work">
<meta property="og:description" content="Daily data entry work, projects, screenshots and useful resources.">
<meta property="og:type" content="website">

<!-- ===================== FIREBASE SDKs (compat) ===================== -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>
/* ============================ BASE ============================ */
:root{
  --bg:#f5f7fb;
  --surface:#ffffff;
  --text:#0f172a;
  --muted:#64748b;
  --border:#e4e9f2;
  --primary:#1d4ed8;
  --primary-dark:#1638a8;
  --primary-soft:#eef4ff;
  --accent:#0d9488;
  --danger:#dc2626;
  --danger-soft:#fee2e2;
  --ok:#16a34a;
  --ok-soft:#dcfce7;
  --warn:#d97706;
  --warn-soft:#fef3c7;
  --radius:14px;
  --radius-sm:10px;
  --shadow:0 1px 2px rgba(15,23,42,.05), 0 10px 26px rgba(15,23,42,.06);
  --shadow-lg:0 18px 44px rgba(15,23,42,.14);
  --maxw:1180px;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;font-family:var(--font);background:var(--bg);color:var(--text);
  line-height:1.65;-webkit-font-smoothing:antialiased;font-size:16px;
}
img{max-width:100%;display:block}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{line-height:1.25;margin:0 0 .5em;font-weight:800;letter-spacing:-.02em}
h1{font-size:clamp(1.9rem,4vw,2.9rem)}
h2{font-size:clamp(1.4rem,2.6vw,2rem)}
h3{font-size:1.12rem}
p{margin:0 0 1em}
.muted{color:var(--muted)}
.container{width:100%;max-width:var(--maxw);margin:0 auto;padding:0 20px}
.section{padding:56px 0}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:26px;flex-wrap:wrap}
.section-head p{margin:0;color:var(--muted)}
.center{text-align:center}

/* ============================ BUTTONS ============================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 18px;border-radius:var(--radius-sm);border:1px solid transparent;
  font-weight:650;font-size:.92rem;cursor:pointer;font-family:inherit;
  transition:transform .12s ease, background .18s ease, border-color .18s, color .18s;
  background:var(--surface);color:var(--text);white-space:nowrap;line-height:1.2;
}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark);text-decoration:none}
.btn-outline{border-color:var(--border);background:#fff;color:var(--text)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary);text-decoration:none}
.btn-ghost{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.35)}
.btn-ghost:hover{background:rgba(255,255,255,.24);text-decoration:none}
.btn-danger{background:var(--danger-soft);color:var(--danger)}
.btn-danger:hover{background:#fecaca;text-decoration:none}
.btn-sm{padding:6px 12px;font-size:.8rem;border-radius:8px}
.btn-lg{padding:13px 26px;font-size:1rem}
.btn-block{width:100%}
.btn[disabled]{opacity:.6;cursor:not-allowed}

/* ============================ HEADER ============================ */
.site-header{
  position:sticky;top:0;z-index:60;background:rgba(255,255,255,.92);
  backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--border);
}
.nav{display:flex;align-items:center;gap:14px;height:68px;position:relative}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--text);font-size:1.02rem}
.brand:hover{text-decoration:none}
.brand-mark{
  width:38px;height:38px;border-radius:11px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;
  display:grid;place-items:center;font-weight:800;font-size:.9rem;letter-spacing:.5px;
}
.nav-links{display:flex;align-items:center;gap:4px;margin-left:auto}
.nav-links a{padding:9px 13px;border-radius:9px;color:var(--muted);font-weight:650;font-size:.9rem}
.nav-links a:hover{background:var(--bg);color:var(--text);text-decoration:none}
.nav-links a.active{color:var(--primary);background:var(--primary-soft)}
.hamburger{
  display:none;margin-left:auto;background:#fff;border:1px solid var(--border);
  border-radius:10px;width:42px;height:42px;font-size:1.2rem;cursor:pointer;color:var(--text);
}
@media(max-width:900px){
  .hamburger{display:grid;place-items:center}
  .nav-links{
    position:absolute;top:64px;left:0;right:0;display:none;flex-direction:column;
    align-items:stretch;background:#fff;border:1px solid var(--border);border-radius:14px;
    padding:10px;box-shadow:var(--shadow-lg);gap:2px;margin:0;
  }
  .nav-links.open{display:flex}
  .nav-links a{padding:12px 14px}
}

/* ============================ HERO ============================ */
.hero{
  background:linear-gradient(135deg,#0b1220 0%,#15307a 52%,#0d9488 130%);
  color:#fff;padding:76px 0 68px;position:relative;overflow:hidden;
}
.hero::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(700px 340px at 88% 12%, rgba(255,255,255,.16), transparent 65%);
  pointer-events:none;
}
.hero-grid{display:grid;grid-template-columns:1.35fr .85fr;gap:52px;align-items:center;position:relative;z-index:1}
.hero h1{color:#fff;margin-bottom:6px}
.hero .role{
  display:inline-block;font-weight:700;color:#a7f3d0;letter-spacing:.14em;
  text-transform:uppercase;font-size:.78rem;margin-bottom:14px;
}
.hero-badge{
  display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.25);padding:6px 14px;border-radius:999px;
  font-size:.78rem;font-weight:650;margin-bottom:18px;
}
.dot{width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 0 4px rgba(52,211,153,.22)}
.hero-text{color:#dbeafe;font-size:1.05rem;max-width:56ch;margin-bottom:26px}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:34px}
.hero-stats{display:flex;gap:36px;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.18);padding-top:22px}
.hero-stats div strong{display:block;font-size:1.6rem;line-height:1.1}
.hero-stats div span{font-size:.8rem;color:#bfdbfe;text-transform:uppercase;letter-spacing:.08em}
.hero-media{display:flex;justify-content:center}
.hero-media img{
  width:100%;max-width:330px;aspect-ratio:1/1;object-fit:cover;border-radius:24px;
  border:5px solid rgba(255,255,255,.18);box-shadow:0 26px 60px rgba(0,0,0,.36);
}
@media(max-width:900px){
  .hero{padding:52px 0}
  .hero-grid{grid-template-columns:1fr;gap:34px;text-align:left}
  .hero-media{order:-1;justify-content:flex-start}
  .hero-media img{max-width:190px;border-radius:20px}
  .hero-stats{gap:24px}
}

/* ============================ CARDS / GRID ============================ */
.grid{display:grid;gap:24px}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-2{grid-template-columns:repeat(2,1fr)}
@media(max-width:980px){.grid-3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:660px){.grid-3,.grid-2{grid-template-columns:1fr}}

.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;
  transition:transform .18s ease, box-shadow .18s ease;
}
.card:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(15,23,42,.12)}
.card-img{width:100%;aspect-ratio:16/10;object-fit:cover;background:#e8edf6}
.card-body{padding:18px 18px 20px;display:flex;flex-direction:column;gap:10px;flex:1}
.card-body h3{margin:0}
.card-body h3 a{color:var(--text)}
.card-body h3 a:hover{color:var(--primary);text-decoration:none}
.card-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.excerpt{color:var(--muted);font-size:.92rem;margin:0;flex:1}
.read-more{font-weight:700;font-size:.86rem;margin-top:4px}

.badge{
  display:inline-block;padding:4px 11px;border-radius:999px;font-size:.7rem;font-weight:750;
  letter-spacing:.05em;text-transform:uppercase;background:var(--primary-soft);color:var(--primary);
}
.badge.gray{background:#eef2f7;color:var(--muted)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.danger{background:var(--danger-soft);color:var(--danger)}

/* ============================ POST ACTIONS (LIKE/SHARE) ============================ */
.post-actions{
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  padding-top:12px;margin-top:auto;border-top:1px solid var(--border);
}
.action-btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 12px;border-radius:8px;border:1px solid var(--border);
  background:#fff;color:var(--text);font-weight:650;font-size:.82rem;
  cursor:pointer;font-family:inherit;line-height:1;transition:.15s;
}
.action-btn:hover{border-color:var(--primary);color:var(--primary)}
.action-btn.liked{background:#fee2e2;border-color:#fca5a5;color:#dc2626}
.action-btn.liked:hover{background:#fecaca;border-color:#f87171}

/* ============================ HEADER USER / FOLLOW ============================ */
.header-user{
  display:inline-flex;align-items:center;gap:8px;
}
.follow-btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 14px;border-radius:999px;border:1px solid var(--border);
  background:#fff;color:var(--text);font-weight:650;font-size:.85rem;
  cursor:pointer;font-family:inherit;line-height:1;transition:.15s;white-space:nowrap;
}
.follow-btn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-soft)}
.follow-btn.following{background:var(--ok-soft);border-color:#86efac;color:var(--ok)}
.follow-btn.following:hover{background:#bbf7d0;border-color:#4ade80}

.user-chip{
  display:inline-flex;align-items:center;gap:8px;
  padding:4px 12px 4px 4px;border-radius:999px;
  background:var(--bg);border:1px solid var(--border);
  font-weight:650;font-size:.85rem;color:var(--text);
}
.user-chip img{
  width:28px;height:28px;border-radius:50%;object-fit:cover;flex:0 0 auto;
}
.user-chip .user-initials{
  width:28px;height:28px;border-radius:50%;flex:0 0 auto;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  color:#fff;display:grid;place-items:center;font-weight:800;font-size:.75rem;
}
.user-chip .user-name{
  max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.user-chip .signout{
  background:none;border:none;cursor:pointer;color:var(--muted);
  font-size:1.1rem;line-height:1;padding:0 4px;font-family:inherit;
}
.user-chip .signout:hover{color:var(--danger)}
@media(max-width:900px){
  .header-user{flex-direction:column;align-items:stretch;gap:6px}
  .user-chip{justify-content:center}
}

/* ============================ POST PAGE ============================ */
.post-hero{padding:40px 0 0}
.breadcrumb{font-size:.85rem;color:var(--muted);margin-bottom:14px}
.breadcrumb a{color:var(--muted)}
.post-title{font-size:clamp(1.7rem,3.4vw,2.5rem);margin-bottom:14px}
.post-meta{display:flex;gap:14px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:.88rem;margin-bottom:26px}
.post-featured{border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);margin-bottom:34px;background:#e8edf6}
.post-featured img{width:100%;max-height:520px;object-fit:cover}
.article{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:34px;box-shadow:var(--shadow)}
.article h2{margin-top:1.6em;font-size:1.45rem}
.article h3{margin-top:1.4em;font-size:1.15rem}
.article ul,.article ol{padding-left:22px;margin:0 0 1em}
.article li{margin-bottom:.4em}
.article blockquote{
  margin:1.4em 0;padding:14px 20px;border-left:4px solid var(--primary);
  background:var(--primary-soft);border-radius:0 10px 10px 0;color:#1e293b;
}
.article table{width:100%;border-collapse:collapse;margin:1.3em 0;font-size:.92rem}
.article th,.article td{border:1px solid var(--border);padding:9px 12px;text-align:left}
.article th{background:#f8fafc;font-weight:700}
.article img{border-radius:10px;margin:1em 0}
@media(max-width:640px){.article{padding:22px}}

.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:14px 0 6px}
@media(max-width:700px){.gallery{grid-template-columns:repeat(2,1fr)}}
.gallery img{
  aspect-ratio:4/3;object-fit:cover;border-radius:12px;cursor:zoom-in;
  border:1px solid var(--border);transition:transform .18s, box-shadow .18s;
}
.gallery img:hover{transform:scale(1.02);box-shadow:var(--shadow-lg)}

.link-list{display:grid;gap:12px;margin:14px 0}
.link-card{
  display:flex;align-items:center;gap:14px;padding:15px 18px;border:1px solid var(--border);
  border-radius:12px;background:#fbfcfe;transition:.18s;
}
.link-card:hover{border-color:var(--primary);background:var(--primary-soft);text-decoration:none}
.link-card .ico{
  width:40px;height:40px;flex:0 0 auto;border-radius:10px;display:grid;place-items:center;
  background:var(--primary);color:#fff;font-size:1.05rem;font-weight:700;
}
.link-card strong{display:block;color:var(--text);font-size:.96rem}
.link-card small{color:var(--muted);font-size:.82rem;display:block;word-break:break-all}

.tag-row{display:flex;gap:8px;flex-wrap:wrap;margin:26px 0 0}
.tag{
  font-size:.78rem;padding:5px 12px;border-radius:999px;background:#f1f5f9;color:#475569;
  font-weight:600;border:1px solid var(--border);
}

.share-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:28px;padding-top:22px;border-top:1px solid var(--border)}
.share-row span{font-size:.85rem;color:var(--muted);font-weight:650}

.post-reactions{
  display:flex;gap:12px;align-items:center;flex-wrap:wrap;
  margin-top:22px;padding-top:18px;border-top:1px solid var(--border);
}
.reaction-btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 18px;border-radius:999px;border:1px solid var(--border);
  background:#fff;color:var(--text);font-weight:650;font-size:.92rem;
  cursor:pointer;font-family:inherit;line-height:1;transition:.15s;
}
.reaction-btn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-soft)}
.reaction-btn.liked{background:#fee2e2;border-color:#fca5a5;color:#dc2626}
.reaction-btn.liked:hover{background:#fecaca;border-color:#f87171}
.reaction-btn .count{
  font-size:.78rem;background:rgba(0,0,0,.06);padding:2px 8px;border-radius:999px;font-weight:750;
}
.reaction-btn.liked .count{background:rgba(220,38,38,.15)}

.post-nav{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:34px}
@media(max-width:640px){.post-nav{grid-template-columns:1fr}}
.post-nav a{
  display:block;padding:16px 18px;border:1px solid var(--border);border-radius:12px;
  background:#fff;color:var(--text);box-shadow:var(--shadow);
}
.post-nav a:hover{border-color:var(--primary);text-decoration:none}
.post-nav small{display:block;color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}

/* ============================ FILTERS / SEARCH ============================ */
.filter-bar{
  background:#fff;border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:var(--shadow);margin-bottom:28px;
  display:flex;flex-direction:column;gap:14px;
}
.search-form{display:flex;gap:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  padding:7px 15px;border-radius:999px;border:1px solid var(--border);background:#fff;
  font-size:.83rem;font-weight:650;color:var(--muted);cursor:pointer;
}
.chip:hover{border-color:var(--primary);color:var(--primary);text-decoration:none}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff}

/* ============================ FORMS ============================ */
.input,textarea.input,select.input{
  width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);
  font-family:inherit;font-size:.94rem;background:#fff;color:var(--text);transition:.16s;
}
.input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(29,78,216,.13)}
textarea.input{resize:vertical;min-height:110px;line-height:1.6}
.field{margin-bottom:16px}
.field label{display:block;font-weight:700;font-size:.85rem;margin-bottom:7px}
.field .hint{font-size:.78rem;color:var(--muted);margin-top:5px}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:640px){.row-2{grid-template-columns:1fr}}
.check-row{display:flex;align-items:center;gap:10px;font-size:.9rem;font-weight:600}
.radio-row{display:flex;gap:20px;flex-wrap:wrap}
.radio-row label{display:flex;align-items:center;gap:8px;font-weight:650;font-size:.9rem;cursor:pointer}

/* ============================ FOOTER ============================ */
.site-footer{background:#0b1220;color:#94a3b8;margin-top:60px;padding:54px 0 26px}
.footer-grid{display:grid;grid-template-columns:1.6fr 1fr 1fr 1.2fr;gap:36px;margin-bottom:36px}
@media(max-width:900px){.footer-grid{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.footer-grid{grid-template-columns:1fr}}
.site-footer h4{color:#fff;font-size:.82rem;text-transform:uppercase;letter-spacing:.12em;margin-bottom:14px}
.site-footer a{color:#94a3b8;font-size:.9rem;display:block;padding:4px 0}
.site-footer a:hover{color:#fff}
.footer-brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;margin-bottom:14px}
.footer-bottom{
  border-top:1px solid #1e293b;padding-top:20px;display:flex;justify-content:space-between;
  gap:14px;flex-wrap:wrap;font-size:.84rem;
}
.social-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.social-row a{
  width:38px;height:38px;border-radius:10px;background:#1e293b;display:grid;place-items:center;
  color:#cbd5e1;font-size:.85rem;font-weight:700;
}
.social-row a:hover{background:var(--primary);color:#fff;text-decoration:none}

/* ============================ ADMIN LOGIN ============================ */
.login-page{
  min-height:100vh;display:grid;place-items:center;padding:24px;
  background:linear-gradient(135deg,#0b1220,#15307a 60%,#0d9488 140%);
}
.login-card{
  width:100%;max-width:420px;background:#fff;border-radius:18px;padding:36px 32px;
  box-shadow:0 30px 70px rgba(0,0,0,.35);
}
.login-card h1{font-size:1.5rem;margin-bottom:6px}
.login-card .sub{color:var(--muted);font-size:.9rem;margin-bottom:26px}
.demo-box{
  background:var(--primary-soft);border:1px dashed #bfd3ff;color:#1e40af;border-radius:10px;
  padding:11px 14px;font-size:.82rem;margin-bottom:20px;
}
.demo-box code{background:#fff;padding:2px 6px;border-radius:5px;font-weight:700}

/* ============================ ADMIN LAYOUT ============================ */
.admin-wrap{display:grid;grid-template-columns:250px 1fr;min-height:100vh;background:var(--bg)}
.admin-side{background:#0b1220;color:#cbd5e1;padding:22px 14px;display:flex;flex-direction:column;gap:8px}
.side-title{display:flex;align-items:center;gap:11px;padding:0 8px 18px;border-bottom:1px solid #1e293b;margin-bottom:12px}
.side-title strong{display:block;color:#fff;font-size:.92rem}
.side-title small{color:#64748b;font-size:.74rem}
.side-nav{display:flex;flex-direction:column;gap:3px;flex:1}
.side-nav a{
  display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:10px;
  color:#cbd5e1;font-weight:600;font-size:.89rem;
}
.side-nav a:hover{background:#16213a;color:#fff;text-decoration:none}
.side-nav a.active{background:var(--primary);color:#fff}
.side-foot{border-top:1px solid #1e293b;padding-top:12px;display:flex;flex-direction:column;gap:3px}
.side-foot a{color:#94a3b8;font-size:.86rem;padding:9px 13px;border-radius:9px;font-weight:600}
.side-foot a:hover{background:#16213a;color:#fff;text-decoration:none}
.admin-main{padding:28px 30px 60px;overflow-x:hidden}
@media(max-width:900px){
  .admin-wrap{grid-template-columns:1fr}
  .admin-side{position:sticky;top:0;z-index:40;flex-direction:column;padding:12px;gap:6px}
  .side-title{display:none}
  .side-nav{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  .side-nav a{white-space:nowrap;padding:9px 14px}

function starString(rating){
  const n = Math.max(0, Math.min(5, parseInt(rating, 10) || 0));
  return '★'.repeat(n) + '☆'.repeat(5 - n);
}
function avgRating(list){
  if (!list || !list.length) return 0;
  const sum = list.reduce((n, r) => n + (parseInt(r.rating, 10) || 0), 0);
  return Math.round((sum / list.length) * 10) / 10;
}

function parseYouTubeId(url){
  if (!url) return '';
  const s = String(url).trim();
  if (!s) return '';
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  let m = s.match(/(?:youtu\.be\/)([A-Za-z0-9_-]{11})/);
  if (m) return m[1];
  m = s.match(/[?&]v=([A-Za-z0-9_-]{11})/);
  if (m) return m[1];
  m = s.match(/\/embed\/([A-Za-z0-9_-]{11})/);
  if (m) return m[1];
  m = s.match(/\/shorts\/([A-Za-z0-9_-]{11})/);
  if (m) return m[1];
  m = s.match(/\/v\/([A-Za-z0-9_-]{11})/);
  if (m) return m[1];
  m = s.match(/\/([A-Za-z0-9_-]{11})(?:[?&#/]|$)/);
  if (m) return m[1];
  return '';
}
function ytThumb(videoId){
  return videoId ? `https://img.youtube.com/vi/${videoId}/hqdefault.jpg` : '';
}
/* Build a clean, compatibility-focused embed URL. We deliberately avoid
   the `origin` and `enablejsapi` parameters because those are the most
   common causes of the "Video player configuration error". YouTube's
   player works fine without them when the referrer policy is correct. */
function ytEmbedUrl(videoId, autoplay){
  const params = new URLSearchParams();
  if (autoplay) params.set('autoplay', '1');
  params.set('rel', '0');
  params.set('modestbranding', '1');
  params.set('playsinline', '1');
  return `https://www.youtube.com/embed/${videoId}?${params.toString()}`;
}

function loadCache(){

  } catch (e) { console.warn('Cache read failed:', e); }

function saveCache(){
  if (!DB) return;
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify(DB));
  } catch (e) {
    try {
      const light = JSON.parse(JSON.stringify(DB));
      light.media = [];
      light.posts = (light.posts || []).map(p => {
        const copy = { ...p };
        if (copy.featuredImage && copy.featuredImage.startsWith('data:') && copy.featuredImage.length > 200000) {
          copy.featuredImage = '';
        }
        if (Array.isArray(copy.gallery)) {
          copy.gallery = copy.gallery.filter(g => !(g && g.startsWith('data:') && g.length > 200000));
        }
        return copy;
      });
      localStorage.setItem(CACHE_KEY, JSON.stringify(light));
    } catch (e2) { console.warn('Cache write failed entirely:', e2); }
  }
}

async function doLogin(email, password){

    return { ok: true };
  } catch (err) {
    console.warn('Login failed:', err.code, err.message);
    let msg = 'Invalid email or password.';
    if (err.code === 'auth/user-not-found')        msg = 'No admin account found with that email.';
    else if (err.code === 'auth/wrong-password')   msg = 'Incorrect password.';
    else if (err.code === 'auth/invalid-email')    msg = 'Invalid email format.';
    else if (err.code === 'auth/too-many-requests')msg = 'Too many attempts. Please try again later.';
    else if (err.code === 'auth/network-request-failed') msg = 'Network error. Check your connection.';
    return { ok: false, msg };

}
async function signInWithGoogle(){
  try {
    if (auth.currentUser && isLoggedIn()) { await auth.signOut(); }
    const result = await auth.signInWithPopup(googleProvider);
    return { ok: true, user: result.user };
  } catch (err) {
    console.warn('Google sign-in failed:', err.code, err.message);
    if (err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request') {
      return { ok: false, msg: 'Sign-in cancelled.' };
    }
    if (err.code === 'auth/popup-blocked') {
      return { ok: false, msg: 'Popup blocked by browser. Please allow popups and try again.' };
    }
    if (err.code === 'auth/unauthorized-domain') {

function sharePost(postId){

  if (!p) return;
  const url = location.origin + location.pathname + '#/post/' + encodeURIComponent(p.slug);
  const text = p.title + '\n\n' + stripHTML(p.content).slice(0, 140);

  if (navigator.share) {
    navigator.share({ title: p.title, text, url }).catch(() => {});
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(url)
      .then(() => toast('Post link copied to clipboard!', 'success'))
      .catch(() => prompt('Copy this link:', url));
  } else {
    prompt('Copy this link:', url);
  }
}

function playVideo(videoId, containerId){
  const container = document.getElementById(containerId);

        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen"

}

let lastRenderPath = null;
let pendingRender = false;
function render(){
  if (!DB) return;
  if (pendingRender) return;
  pendingRender = true;
  requestAnimationFrame(() => {
    pendingRender = false;
    const { segs, query, path } = parseHash();
    const pathChanged = path !== lastRenderPath;
    lastRenderPath = path;

    const root = document.getElementById('root');
    if (segs[0] === 'admin') {
      renderAdmin(segs.slice(1), query);
    } else {
      renderPublic(segs, query);
    }
    if (pathChanged) {
      try { window.scrollTo({ top: 0, behavior: 'auto' }); } catch (e) {}
    }
  });
}
window.addEventListener('hashchange', render);

/* =====================================================================
   PUBLIC SITE
   ===================================================================== */
function renderPublic(segs, query){
  let content;
  const first = segs[0] || '';

  if (!first)                        content = pageHome();
  else if (first === 'posts')        content = pagePosts(query);
  else if (first === 'category')     content = pagePosts(query, segs[1] || '');
  else if (first === 'post')         content = pagePost(decodeURIComponent(segs[1] || ''));
  else if (first === 'reviews')      content = pageReviews();
  else if (first === 'videos')       content = pageVideos();
  else if (first === 'about')        content = pageAbout();
  else if (first === 'contact')      content = pageContact();
  else                               content = pageNotFound();

  document.getElementById('root').innerHTML = publicShell(content);
}

function navLink(href, label){
  const cur = location.hash || '#/';
  let active = false;
  if (href === '#/') active = (cur === '#/' || cur === '' || cur === '#');
  else active = cur.startsWith(href);
  return `<a href="${href}" class="${active ? 'active' : ''}">${label}</a>`;
}

/* ------------------------- POSTS PAGE ------------------------- */
function postsUrl({ q, cat, page } = {}){
  const params = new URLSearchParams();
  if (q) params.set('q', q);
  if (cat) params.set('cat', cat);
  if (page && page > 1) params.set('page', page);
  const s = params.toString();
  return '#/posts' + (s ? '?' + s : '');
}

function pagePosts(query, catSlug){
  const q = (query.get('q') || '').trim();
  const qLower = q.toLowerCase();
  const catParam = catSlug || query.get('cat') || '';
  const page = Math.max(1, parseInt(query.get('page') || '1', 10) || 1);
  const perPage = 6;

  let list = publishedPosts();

  if (catParam) {
    const c = getCategoryBySlug(catParam);
    if (c) list = list.filter(p => p.categoryId === c.id);
  }
  if (qLower) {
    list = list.filter(p => {
      const hay = [p.title, stripHTML(p.content), (p.tags || []).join(' '),
                   (getCategory(p.categoryId) || {}).name || ''].join(' ').toLowerCase();
      return hay.includes(qLower);
    });
  }

  const total = list.length;
  const pages = Math.max(1, Math.ceil(total / perPage));
  const safePage = Math.min(page, pages);
  const slice = list.slice((safePage - 1) * perPage, safePage * perPage);

  const chips = `
    <a class="chip ${!catParam ? 'active' : ''}" href="${postsUrl({ q })}">All</a>
    ${DB.categories.map(c => `
      <a class="chip ${catParam === c.slug ? 'active' : ''}"
         href="${postsUrl({ q, cat: c.slug })}">${esc(c.name)} <span style="opacity:.65">(${countByCategory(c.id)})</span></a>
    `).join('')}`;

  const pagination = pages > 1 ? `
    <div style="display:flex;justify-content:center;gap:8px;margin-top:36px;flex-wrap:wrap">
      ${safePage > 1 ? `<a class="btn btn-outline btn-sm" href="${postsUrl({ q, cat: catParam, page: safePage - 1 })}">← Previous</a>` : ''}
      ${Array.from({ length: pages }, (_, i) => i + 1).map(n =>
        `<a class="btn ${n === safePage ? 'btn-primary' : 'btn-outline'} btn-sm"
            href="${postsUrl({ q, cat: catParam, page: n })}">${n}</a>`).join('')}
      ${safePage < pages ? `<a class="btn btn-outline btn-sm" href="${postsUrl({ q, cat: catParam, page: safePage + 1 })}">Next →</a>` : ''}
    </div>` : '';

  const activeCat = catParam ? getCategoryBySlug(catParam) : null;

  return `
  <section class="section">
    <div class="container">
      <div class="section-head">
        <div>
          <h2>${activeCat ? esc(activeCat.name) + ' Posts' : 'My Work / Work Posts'}</h2>
          <p>${q ? `Search results for “${esc(q)}” — ${total} found` : `${total} published post${total === 1 ? '' : 's'}`}</p>
        </div>
        <a href="#/" class="btn btn-outline btn-sm">← Home</a>
      </div>

      <div class="filter-bar">
        <form class="search-form" onsubmit="return doSearch(event)">
          <input id="searchInput" class="input" type="search"
                 placeholder="Search posts by title, content, category or tag…"
                 value="${esc(q)}" aria-label="Search posts">
          <button class="btn btn-primary" type="submit">Search</button>
        </form>
        <div class="chips">${chips}</div>
      </div>

      ${slice.length ? `<div class="grid grid-3">${slice.map(postCard).join('')}</div>`
        : `<div class="empty"><h3>No posts found</h3>
             <p>Try a different search term or category.</p>
             <a href="#/posts" class="btn btn-primary btn-sm">Clear filters</a></div>`}

      ${pagination}
    </div>
  </section>`;
}

function doSearch(e){
  e.preventDefault();
  const val = (document.getElementById('searchInput')?.value || '').trim();
  location.hash = postsUrl({ q: val });
  return false;
}

/* ------------------------- SINGLE POST ------------------------- */
function pagePost(slug){
  const p = postBySlug(slug);
  if (!p) return pageNotFound('Post not found. It may have been unpublished.');

  const cat = getCategory(p.categoryId);
  const all = publishedPosts();
  const idx = all.findIndex(x => x.id === p.id);
  const prev = idx > 0 ? all[idx - 1] : null;
  const next = idx >= 0 && idx < all.length - 1 ? all[idx + 1] : null;

  const related = all.filter(x => x.id !== p.id && x.categoryId === p.categoryId).slice(0, 3);
  const gallery = (p.gallery || []).filter(Boolean);
  const links = (p.links || []).filter(l => l && l.url);
  const tags = (p.tags || []).filter(Boolean);
  const shareUrl = encodeURIComponent(location.href);
  const shareTitle = encodeURIComponent(p.title);

  const likeCount = likesForPost(p.id).length;
  const liked = userHasLiked(p.id);

  return `
  <article>
    <div class="container post-hero">
      <div class="breadcrumb">
        <a href="#/">Home</a> › <a href="#/posts">Work Posts</a>
        ${cat ? ` › <a href="#/category/${cat.slug}">${esc(cat.name)}</a>` : ''}
      </div>
      <h1 class="post-title">${esc(p.title)}</h1>
      <div class="post-meta">
        ${cat ? `<span class="badge">${esc(cat.name)}</span>` : ''}
        <span>📅 ${fmtDate(p.publishDate)}</span>
        <span>✍️ ${esc(DB.settings.ownerName)}</span>
        <span>⏱ ${Math.max(1, Math.round(stripHTML(p.content).split(/\s+/).length / 200))} min read</span>
      </div>
    </div>

    <div class="container">
      <div class="post-featured">
        <img src="${imgSrc(p.featuredImage, p.title)}" alt="${esc(p.title)}">
      </div>

      <div class="article">
        ${sanitizeHTML(p.content) || '<p class="muted">No content.</p>'}

        ${gallery.length ? `
          <h2 style="margin-top:1.8em">Gallery</h2>
          <div class="gallery">
            ${gallery.map((g, i) => `
              <img src="${g}" alt="${esc(p.title)} — image ${i + 1}" loading="lazy"
                   onclick="openLightbox(${i})">
            `).join('')}
          </div>` : ''}

        ${links.length ? `
          <h2 style="margin-top:1.8em">Attached Links</h2>
          <div class="link-list">
            ${links.map(l => `
              <a class="link-card" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">
                <span class="ico">↗</span>
                <span>
                  <strong>${esc(l.title || l.url)}</strong>
                  <small>${esc(l.desc || l.url)}</small>
                </span>
              </a>`).join('')}
          </div>` : ''}

        ${tags.length ? `<div class="tag-row">${tags.map(t => `<span class="tag">#${esc(t)}</span>`).join('')}</div>` : ''}

        <div class="post-reactions">
          <button class="reaction-btn ${liked ? 'liked' : ''}" onclick="toggleLike('${p.id}')">
            ${liked ? '❤️' : '🤍'} ${liked ? 'Liked' : 'Like'}
            ${likeCount > 0 ? `<span class="count">${likeCount}</span>` : ''}
          </button>
          <button class="reaction-btn" onclick="sharePost('${p.id}')">
            📤 Share
          </button>
        </div>

        <div class="share-row">
          <span>Share this post:</span>
          <a class="btn btn-outline btn-sm" target="_blank" rel="noopener"
             href="https://twitter.com/intent/tweet?url=${shareUrl}&text=${shareTitle}">Twitter / X</a>
          <a class="btn btn-outline btn-sm" target="_blank" rel="noopener"
             href="https://www.facebook.com/sharer/sharer.php?u=${shareUrl}">Facebook</a>
          <a class="btn btn-outline btn-sm" target="_blank" rel="noopener"
             href="https://www.linkedin.com/sharing/share-offsite/?url=${shareUrl}">LinkedIn</a>
          <a class="btn btn-outline btn-sm" target="_blank" rel="noopener"
             href="https://wa.me/?text=${shareTitle}%20${shareUrl}">WhatsApp</a>
          <button class="btn btn-outline btn-sm" onclick="copyLink()">Copy Link</button>
        </div>
      </div>

      <div class="post-nav">
        ${prev ? `<a href="#/post/${encodeURIComponent(prev.slug)}"><small>← Previous</small>${esc(prev.title)}</a>` : '<span></span>'}
        ${next ? `<a href="#/post/${encodeURIComponent(next.slug)}" style="text-align:right"><small>Next →</small>${esc(next.title)}</a>` : ''}
      </div>

      ${related.length ? `
        <div style="margin-top:52px">
          <div class="section-head"><div><h2>Related Posts</h2></div></div>
          <div class="grid grid-3">${related.map(postCard).join('')}</div>
        </div>` : ''}
    </div>
  </article>
  <div style="height:50px"></div>`;
}

function copyLink(){
  navigator.clipboard?.writeText(location.href)
    .then(() => toast('Link copied to clipboard.', 'info'))
    .catch(() => toast('Could not copy link.', 'error'));
}

/* ------------------------- LIGHTBOX ------------------------- */
let lbImages = [], lbIndex = 0;

function openLightbox(i){
  const { segs } = parseHash();
  const p = postBySlug(decodeURIComponent(segs[1] || ''));
  if (!p) return;
  lbImages = (p.gallery || []).filter(Boolean);
  lbIndex = i;
  updateLightbox();
  document.getElementById('lightbox').classList.add('open');
}
function updateLightbox(){
  const img = document.getElementById('lbImg');
  if (img && lbImages[lbIndex]) img.src = lbImages[lbIndex];
}
function lbMove(dir){
  if (!lbImages.length) return;
  lbIndex = (lbIndex + dir + lbImages.length) % lbImages.length;
  updateLightbox();
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('open');
}
document.addEventListener('keydown', e => {
  const lb = document.getElementById('lightbox');
  if (!lb || !lb.classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') lbMove(-1);
  if (e.key === 'ArrowRight') lbMove(1);
});

/* ------------------------- CERTIFICATION LIGHTBOX ------------------------- */
function openCertLightbox(i){
  const s = DB.settings;
  const allCerts = (s.certifications || []).filter(c => c && c.title);
  const targetCert = allCerts[i];
  if (!targetCert || !targetCert.image) return;
  const withImages = allCerts.filter(c => c.image);
  const idx = withImages.findIndex(c => c.id === targetCert.id);
  lbImages = withImages.map(c => c.image);
  lbIndex = idx >= 0 ? idx : 0;
  updateLightbox();
  document.getElementById('lightbox').classList.add('open');
}

let adShowTimer = null;
let adLastShownAt = 0;

function showAdIfAvailable(){
  const ads = (DB.ads || []).filter(a => a && a.active && a.image && String(a.image).trim());
  if (!ads.length) return;

  const now = Date.now();
  if (now - adLastShownAt < 400) return;
  adLastShownAt = now;

  const ad = ads[Math.floor(Math.random() * ads.length)];

  const modal = document.getElementById('adModal');
  const img = document.getElementById('adModalImage');
  const link = document.getElementById('adModalLink');
  const title = document.getElementById('adModalTitle');
  if (!modal || !img || !link || !title) return;

  img.src = ad.image;
  title.textContent = ad.title || '';
  title.style.display = ad.title ? '' : 'none';

  if (ad.link && String(ad.link).trim()) {
    link.href = ad.link;
    link.style.cursor = 'pointer';
    link.onclick = null;
  } else {
    link.href = 'javascript:void(0)';
    link.style.cursor = 'default';
    link.onclick = (e) => e.preventDefault();
  }

  modal.classList.add('open');
}

function closeAdModal(){
  const modal = document.getElementById('adModal');
  if (modal) modal.classList.remove('open');
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeAdModal();
});

function scheduleAdShow(delay = 500){
  clearTimeout(adShowTimer);
  adShowTimer = setTimeout(() => {
    const { segs } = parseHash();
    if (segs[0] === 'admin') return;
    showAdIfAvailable();
  }, delay);
}

function renderAdmin(segs, query){
  const root = document.getElementById('root');

  if (!isLoggedIn()) {
    root.innerHTML = adminLoginPage();
    return;
  }

  const page = segs[0] || 'dashboard';
  let content = '';
  let active = page;

  switch (page) {
    case 'dashboard':   content = adminDashboard(); break;
    case 'posts':       content = adminPosts(query); break;
    case 'new':         content = adminPostForm(null); active = 'new'; break;
    case 'edit':        content = adminPostForm(segs[1]); active = 'posts'; break;
    case 'categories':  content = adminCategories(); break;
    case 'clients':     content = adminClients(); break;
    case 'reviews':     content = adminReviews(); break;
    case 'media':       content = adminMedia(); break;
    case 'messages':    content = adminMessages(); break;
    case 'ads':         content = adminAds(); active = 'ads'; break;
    case 'videos':      content = adminVideos(); active = 'videos'; break;
    case 'likes':       content = adminLikes(); active = 'likes'; break;
    case 'followers':   content = adminFollowers(); active = 'followers'; break;
    case 'settings':    content = adminSettings(); break;
    default:            content = adminDashboard();
  }

  root.innerHTML = adminShell(active, content);

  if (page === 'settings') {
    renderCertEditor();
  }
}

async function handleLogin(e){
  e.preventDefault();
  const email = document.getElementById('lEmail').value.trim();
  const pass = document.getElementById('lPass').value;
  if (!email || !pass) { toast('Please enter email and password.', 'error'); return false; }

  const btn = e.target.querySelector('button[type="submit"]');
  if (btn) { btn.disabled = true; btn.textContent = 'Signing in…'; }

  const res = await doLogin(email, pass);

  if (btn) { btn.disabled = false; btn.textContent = 'Login'; }

  if (res.ok) {
    toast('Welcome back!', 'success');
    if (location.hash === '#/admin' || location.hash === '#/admin/') {
      location.hash = '#/admin/dashboard';
    } else { render(); }
  } else {
    toast(res.msg || 'Invalid email or password.', 'error');
  }
  return false;
}

/* ------------------------- MANAGE POSTS ------------------------- */
function adminPosts(query){
  const q = (query.get('q') || '').trim().toLowerCase();
  const status = query.get('status') || '';
  const catId = query.get('cat') || '';

  let list = [...DB.posts].sort((a, b) =>
    new Date(b.publishDate || b.createdAt) - new Date(a.publishDate || a.createdAt));

  if (status) list = list.filter(p => p.status === status);
  if (catId) list = list.filter(p => p.categoryId === catId);
  if (q) list = list.filter(p =>
    (p.title + ' ' + stripHTML(p.content) + ' ' + (p.tags || []).join(' ')).toLowerCase().includes(q));

  const buildUrl = (over = {}) => {
    const params = new URLSearchParams();
    const merged = { q, status, cat: catId, ...over };
    if (merged.q) params.set('q', merged.q);
    if (merged.status) params.set('status', merged.status);
    if (merged.cat) params.set('cat', merged.cat);
    const s = params.toString();
    return '#/admin/posts' + (s ? '?' + s : '');
  };

  return `
  <div class="page-head">
    <div>
      <h1>Manage Posts</h1>
      <p>${list.length} post${list.length === 1 ? '' : 's'} found</p>
    </div>
    <a href="#/admin/new" class="btn btn-primary">＋ Add New Post</a>
  </div>

  <div class="panel">
    <div class="filter-bar" style="box-shadow:none;border:none;padding:0;margin-bottom:18px">
      <form class="search-form" onsubmit="return adminSearch(event)">
        <input id="adminSearchInput" class="input" type="search" placeholder="Search posts…" value="${esc(query.get('q') || '')}">
        <button class="btn btn-primary" type="submit">Search</button>
      </form>
      <div class="chips">
        <a class="chip ${!status ? 'active' : ''}" href="${buildUrl({ status: '' })}">All</a>
        <a class="chip ${status === 'published' ? 'active' : ''}" href="${buildUrl({ status: 'published' })}">Published</a>
        <a class="chip ${status === 'draft' ? 'active' : ''}" href="${buildUrl({ status: 'draft' })}">Drafts</a>
        <span style="width:1px;background:var(--border);margin:0 4px"></span>
        <a class="chip ${!catId ? 'active' : ''}" href="${buildUrl({ cat: '' })}">All Categories</a>
        ${DB.categories.map(c =>
          `<a class="chip ${catId === c.id ? 'active' : ''}" href="${buildUrl({ cat: c.id })}">${esc(c.name)}</a>`
        ).join('')}
      </div>
    </div>

    ${list.length ? `
      <div class="table-wrap">
        <table class="data">
          <thead>
            <tr>
              <th>Post</th><th>Category</th><th>Status</th><th>Featured</th>
              <th>Likes</th><th>Date</th><th style="text-align:right">Actions</th>
            </tr>
          </thead>
          <tbody>
            ${list.map(p => {
              const c = getCategory(p.categoryId);
              const likeCount = likesForPost(p.id).length;
              return `<tr>
                <td>
                  <div style="display:flex;gap:10px;align-items:center">
                    <img src="${imgSrc(p.featuredImage, 'IMG')}" alt=""
                         style="width:48px;height:48px;object-fit:cover;border-radius:8px;flex:0 0 auto">
                    <div>
                      <strong>${esc(p.title)}</strong>
                      <div class="muted" style="font-size:.78rem">/post/${esc(p.slug)}</div>
                    </div>
                  </div>
                </td>
                <td>${c ? esc(c.name) : '—'}</td>
                <td><span class="badge ${p.status === 'published' ? 'ok' : 'warn'}">${p.status}</span></td>
                <td>${p.featured ? '<span class="badge warn">Yes</span>' : '<span class="muted">No</span>'}</td>
                <td>❤️ ${likeCount}</td>
                <td style="white-space:nowrap">${fmtDate(p.publishDate)}</td>
                <td>
                  <div class="t-actions" style="justify-content:flex-end">
                    <a class="btn btn-outline btn-sm" href="#/admin/edit/${p.id}">Edit</a>
                    <a class="btn btn-outline btn-sm" href="#/post/${encodeURIComponent(p.slug)}" target="_blank">View</a>
                    <button class="btn btn-outline btn-sm" onclick="togglePublish('${p.id}')">
                      ${p.status === 'published' ? 'Unpublish' : 'Publish'}
                    </button>
                    <button class="btn btn-outline btn-sm" onclick="toggleFeature('${p.id}')">
                      ${p.featured ? 'Unfeature' : 'Feature'}
                    </button>
                    <button class="btn btn-danger btn-sm" onclick="deletePost('${p.id}')">Delete</button>
                  </div>
                </td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>` : `<div class="empty"><h3>No posts match your filters</h3>
        <p>Try clearing the search or filters.</p>
        <a href="#/admin/posts" class="btn btn-primary btn-sm">Clear filters</a></div>`}
  </div>`;
}

function adminSearch(e){
  e.preventDefault();
  const v = (document.getElementById('adminSearchInput')?.value || '').trim();
  const params = new URLSearchParams();
  if (v) params.set('q', v);
  const s = params.toString();
  location.hash = '#/admin/posts' + (s ? '?' + s : '');
  return false;
}

function togglePublish(postId){
  const p = DB.posts.find(x => x.id === postId);
  if (!p) return;
  p.status = p.status === 'published' ? 'draft' : 'published';
  if (p.status === 'published' && !p.publishDate) p.publishDate = new Date().toISOString();
  saveDB();
  toast(p.status === 'published' ? 'Post published successfully.' : 'Post moved to drafts.',
        p.status === 'published' ? 'success' : 'info');
  render();
}
function toggleFeature(postId){
  const p = DB.posts.find(x => x.id === postId);
  if (!p) return;
  p.featured = !p.featured;
  saveDB();
  toast(p.featured ? 'Post marked as featured.' : 'Post removed from featured.', 'info');
  render();
}
function deletePost(postId){
  const p = DB.posts.find(x => x.id === postId);
  if (!p) return;
  if (!confirm(`Delete "${p.title}" permanently?\n\nThis action cannot be undone.`)) return;
  DB.posts = DB.posts.filter(x => x.id !== postId);
  saveDB();
  toast('Post deleted successfully.', 'success');
  render();
}

function autoSlug(){
  const title = document.getElementById('pTitle').value;
  const slugEl = document.getElementById('pSlug');
  if (!slugEl) return;
  if (!slugEl.dataset.touched) {
    slugEl.value = slugify(title);
    const prev = document.getElementById('slugPreview');
    if (prev) prev.textContent = slugEl.value || 'your-post-slug';
  }
}
document.addEventListener('input', e => {
  if (e.target && e.target.id === 'pSlug') {
    e.target.dataset.touched = '1';
    const prev = document.getElementById('slugPreview');
    if (prev) prev.textContent = slugify(e.target.value) || 'your-post-slug';
  }
});

function execCmd(cmd, val){
  const ed = document.getElementById('editor');
  if (!ed) return;
  ed.focus();
  try { document.execCommand(cmd, false, val || null); }
  catch (err) { console.warn(err); }
}
function insertLink(){
  const url = prompt('Enter the URL (including https://):', 'https://');
  if (url && url.trim() && url !== 'https://') { execCmd('createLink', url.trim()); }
}
function insertTable(){
  const html = `<table><thead><tr><th>Field</th><th>Value</th><th>Notes</th></tr></thead>
  <tbody><tr><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr>
  <tr><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr></tbody></table><p><br></p>`;
  execCmd('insertHTML', html);
}

function updateFeaturedPreview(){
  const val = document.getElementById('pFeatured')?.value || '';
  const img = document.getElementById('featuredPreview');
  if (img) img.src = imgSrc(val, 'Featured Image');
}
async function uploadFeatured(input){
  const file = input.files && input.files[0];
  if (!file) return;
  try {
    const data = await compressImage(file, 1600, 0.82);
    const field = document.getElementById('pFeatured');
    if (field) field.value = '';
    const img = document.getElementById('featuredPreview');
    img.src = data;
    img.dataset.dataurl = data;
    toast('Featured image uploaded.', 'success');
  } catch (e) { toast('Image upload failed.', 'error'); }
  input.value = '';
}

async function uploadGallery(input){
  const files = Array.from(input.files || []);
  if (!files.length) return;
  for (const f of files) {
    if (editorState.gallery.length >= 20) { toast('Maximum 20 gallery images.', 'error'); break; }
    try {
      const data = await compressImage(f, 1400, 0.8);
      editorState.gallery.push(data);
    } catch (e) { console.warn(e); }
  }
  input.value = '';
  renderGalleryEditor();
  toast('Images added to gallery.', 'success');
}
function renderGalleryEditor(){
  const c = document.getElementById('galleryEditor');
  if (!c) return;
  c.innerHTML = editorState.gallery.length
    ? editorState.gallery.map((src, i) => `
        <div class="thumb">
          <img src="${src}" alt="Gallery image ${i + 1}">
          <button type="button" onclick="removeGalleryImage(${i})" title="Remove">✕</button>
        </div>`).join('')
    : '<p class="muted" style="grid-column:1/-1;font-size:.86rem">No gallery images added yet.</p>';
}
function removeGalleryImage(i){
  editorState.gallery.splice(i, 1);
  renderGalleryEditor();
}

function addLink(){
  editorState.links.push({ title: '', url: '', desc: '' });
  renderLinksEditor();
}
function removeLink(i){
  editorState.links.splice(i, 1);
  renderLinksEditor();
}
function renderLinksEditor(){
  const c = document.getElementById('linksEditor');
  if (!c) return;
  c.innerHTML = editorState.links.length
    ? editorState.links.map((l, i) => `
        <div class="link-row">

        </div>`).join('')
    : '<p class="muted" style="font-size:.86rem;margin:0 0 10px">No links added yet.</p>';
}

function collectPostData(){
  const title = (document.getElementById('pTitle')?.value || '').trim();
  if (!title) { toast('Post title is required.', 'error'); return null; }

  const contentHTML = document.getElementById('editor')?.innerHTML || '';
  if (stripHTML(contentHTML).length < 5) { toast('Please write some post content.', 'error'); return null; }

  const previewImg = document.getElementById('featuredPreview');
  const featuredUrl = (document.getElementById('pFeatured')?.value || '').trim();
  let featuredImage = featuredUrl;
  if (!featuredImage && previewImg && previewImg.dataset.dataurl) {
    featuredImage = previewImg.dataset.dataurl;
  } else if (!featuredImage && previewImg && previewImg.src.startsWith('data:')) {
    const existingId = document.getElementById('pId')?.value;
    const existing = existingId ? DB.posts.find(x => x.id === existingId) : null;
    featuredImage = existing ? existing.featuredImage : '';
  }

  let slug = slugify(document.getElementById('pSlug')?.value || title);

  const currentId = document.getElementById('pId')?.value || '';
  const taken = DB.posts.some(p => p.slug === slug && p.id !== currentId);
  if (taken) slug = slug + '-' + uid().slice(0, 4);

  const tags = (document.getElementById('pTags')?.value || '')
    .split(',').map(t => t.trim()).filter(Boolean).slice(0, 12);

  const status = document.querySelector('input[name="pStatus"]:checked')?.value || 'draft';
  const featured = document.getElementById('pFeaturedFlag')?.checked || false;
  const dateVal = document.getElementById('pDate')?.value;
  const publishDate = dateVal ? new Date(dateVal).toISOString() : new Date().toISOString();

  return {
    title, slug,
    categoryId: document.getElementById('pCategory')?.value || '',
    featuredImage,
    content: sanitizeHTML(contentHTML),
    gallery: [...editorState.gallery],
    links: editorState.links
      .filter(l => l.url && l.url.trim())
      .map(l => ({ title: l.title.trim() || l.url.trim(), url: l.url.trim(), desc: (l.desc || '').trim() })),
    tags, status, featured, publishDate,
    seoTitle: (document.getElementById('pSeoTitle')?.value || '').trim(),
    seoDesc: (document.getElementById('pSeoDesc')?.value || '').trim()
  };
}

function savePost(forceStatus){
  const data = collectPostData();
  if (!data) return;

  if (forceStatus) data.status = forceStatus;

  const existingId = document.getElementById('pId')?.value;

  if (existingId) {
    const p = DB.posts.find(x => x.id === existingId);
    if (p) Object.assign(p, data, { updatedAt: new Date().toISOString() });
    toast(data.status === 'published' ? 'Post updated and published.' : 'Post saved as draft.', 'success');
  } else {
    DB.posts.unshift(Object.assign({
      id: uid(), createdAt: new Date().toISOString()
    }, data));
    toast(data.status === 'published' ? 'Post published successfully.' : 'Post saved as draft.', 'success');
  }

  saveDB();
  editorState = { key: null, gallery: [], links: [] };
  location.hash = '#/admin/posts';
  if (location.hash === '#/admin/posts') render();
}

function previewPost(){
  const data = collectPostData();
  if (!data) return;
  const w = window.open('', '_blank');
  if (!w) { toast('Please allow pop-ups to preview.', 'error'); return; }
  const cat = getCategory(data.categoryId);
  w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8">
    <title>${esc(data.title)} — Preview</title>
    <style>
      body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;

function addCategory(e){
  e.preventDefault();
  const input = document.getElementById('newCatName');
  const name = input.value.trim();
  if (!name) return false;
  if (DB.categories.some(c => c.name.toLowerCase() === name.toLowerCase())) {
    toast('This category already exists.', 'error');
    return false;
  }
  DB.categories.push({ id: uid(), name, slug: slugify(name) });
  saveDB();
  input.value = '';
  toast('Category added successfully.', 'success');
  render();
  return false;
}
function renameCategory(catId){
  const c = DB.categories.find(x => x.id === catId);
  if (!c) return;
  const name = prompt('New category name:', c.name);
  if (!name || !name.trim()) return;
  c.name = name.trim();
  c.slug = slugify(c.name);
  saveDB();
  toast('Category updated.', 'success');
  render();
}
function deleteCategory(catId){
  const c = DB.categories.find(x => x.id === catId);
  if (!c) return;
  const count = countByCategory(catId);
  if (count > 0) {
    if (!confirm(`"${c.name}" is used by ${count} post(s).\n\nThose posts will become uncategorised. Continue?`)) return;
  } else {
    if (!confirm(`Delete category "${c.name}"?`)) return;
  }
  DB.categories = DB.categories.filter(x => x.id !== catId);
  saveDB();
  toast('Category deleted.', 'success');
  render();
}

function addClient(e){
  e.preventDefault();
  const name = document.getElementById('clName').value.trim();
  if (!name) { toast('Client name is required.', 'error'); return false; }

  const client = {
    id: uid(), name,
    company: document.getElementById('clCompany').value.trim(),
    email: document.getElementById('clEmail').value.trim(),
    phone: document.getElementById('clPhone').value.trim(),
    project: document.getElementById('clProject').value.trim(),
    status: document.getElementById('clStatus').value || 'active',
    notes: document.getElementById('clNotes').value.trim(),
    createdAt: new Date().toISOString()
  };

  if (!DB.clients) DB.clients = [];
  DB.clients.unshift(client);
  saveDB();
  toast('Client added successfully.', 'success');
  render();
  return false;
}

function editClient(clientId){
  const c = DB.clients.find(x => x.id === clientId);
  if (!c) return;
  const name = prompt('Client name:', c.name);
  if (name === null) return;
  const company = prompt('Company:', c.company || '');
  if (company === null) return;
  const email = prompt('Email:', c.email || '');
  if (email === null) return;
  const phone = prompt('Phone:', c.phone || '');
  if (phone === null) return;
  const project = prompt('Project / Service:', c.project || '');
  if (project === null) return;

  c.name = name.trim() || c.name;
  c.company = company.trim();
  c.email = email.trim();
  c.phone = phone.trim();
  c.project = project.trim();
  saveDB();
  toast('Client updated successfully.', 'success');
  render();
}

function toggleClientStatus(clientId){
  const c = DB.clients.find(x => x.id === clientId);
  if (!c) return;
  const order = ['active', 'pending', 'completed'];
  const idx = order.indexOf(c.status || 'active');
  c.status = order[(idx + 1) % order.length];
  saveDB();
  toast(`Client status set to "${c.status}".`, 'info');
  render();
}

function deleteClient(clientId){
  const c = DB.clients.find(x => x.id === clientId);
  if (!c) return;
  if (!confirm(`Delete client "${c.name}" permanently?`)) return;
  DB.clients = DB.clients.filter(x => x.id !== clientId);
  saveDB();
  toast('Client deleted successfully.', 'success');
  render();
}

function filterClients(term){
  const t = (term || '').toLowerCase();
  $$('#clientsTable tbody tr').forEach(tr => {
    tr.style.display = (tr.dataset.search || '').includes(t) ? '' : 'none';
  });
}

            <button type="button" onclick="deleteMedia('${m.id}')" title="Delete">✕</button>
            <div style="padding:8px;font-size:.74rem;background:#fff">
              <div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:650">${esc(m.name)}</div>

            </div>

      </div>
    </div>` : `<div class="empty"><h3>Media library is empty</h3>
      <p>Upload images to reuse them in your posts.</p></div>`}`;
}

async function uploadMedia(input){
  const files = Array.from(input.files || []);
  if (!files.length) return;
  let ok = 0;
  for (const f of files) {
    if (!/^image\/(jpeg|jpg|png|webp)$/i.test(f.type)) {
      toast(`Skipped "${f.name}" — unsupported format.`, 'error');
      continue;
    }
    try {
      const data = await compressImage(f, 1600, 0.8);
      DB.media.unshift({
        id: uid(), name: f.name, data,
        alt: f.name.replace(/\.[^.]+$/, '').replace(/[-_]/g, ' '),
        date: new Date().toISOString()
      });
      ok++;
    } catch (e) { console.warn(e); }
  }
  input.value = '';
  if (ok) { saveDB(); toast(`${ok} image${ok === 1 ? '' : 's'} uploaded successfully.`, 'success'); render(); }
}
function deleteMedia(mediaId){
  const m = DB.media.find(x => x.id === mediaId);
  if (!m) return;
  if (!confirm(`Delete "${m.name}" from the media library?`)) return;
  DB.media = DB.media.filter(x => x.id !== mediaId);
  saveDB();
  toast('Image deleted.', 'success');
  render();
}
function copyMediaUrl(mediaId){
  const m = DB.media.find(x => x.id === mediaId);
  if (!m) return;
  navigator.clipboard?.writeText(m.data)
    .then(() => toast('Image URL copied. Paste it in the Featured Image field.', 'info'))
    .catch(() => toast('Could not copy.', 'error'));
}
function filterMedia(term){
  const t = (term || '').toLowerCase();
  $$('#mediaGrid .thumb').forEach(el => {
    el.style.display = (el.dataset.name || '').includes(t) ? '' : 'none';
  });
}

function updateAdPreview(){
  const url = (document.getElementById('adImageUrl')?.value || '').trim();
  const img = document.getElementById('adPreview');
  if (!img) return;
  img.src = url || pendingAdImage || placeholderImage('Ad Preview', 15);
}

async function uploadAdImage(input){
  const file = input.files && input.files[0];
  if (!file) return;
  try {
    const data = await compressImage(file, 1200, 0.85);
    pendingAdImage = data;
    const urlField = document.getElementById('adImageUrl');
    if (urlField) urlField.value = '';
    const img = document.getElementById('adPreview');
    if (img) img.src = data;
    toast('Ad image uploaded.', 'success');
  } catch (e) { toast('Image upload failed.', 'error'); }
  input.value = '';
}

function addAd(e){
  e.preventDefault();

  const title = (document.getElementById('adTitle')?.value || '').trim();
  const url = (document.getElementById('adImageUrl')?.value || '').trim();
  const link = (document.getElementById('adLink')?.value || '').trim();
  const active = document.getElementById('adActive')?.checked || false;

  const image = url || pendingAdImage;
  if (!image) {
    toast('Please upload an ad image or paste an image URL.', 'error');
    return false;
  }

  if (link && !/^https?:\/\//i.test(link)) {
    toast('Link must start with http:// or https://', 'error');
    return false;
  }

  if (!DB.ads) DB.ads = [];
  DB.ads.unshift({
    id: uid(), title, image, link, active,
    createdAt: new Date().toISOString()
  });

  pendingAdImage = '';
  saveDB();
  toast('Ad added successfully.', 'success');
  render();
  return false;
}

function toggleAdActive(id){
  const a = (DB.ads || []).find(x => x.id === id);
  if (!a) return;
  a.active = !a.active;
  saveDB();
  toast(a.active ? 'Ad enabled — visitors will see it.' : 'Ad disabled.', 'info');
  render();
}

function deleteAd(id){
  const a = (DB.ads || []).find(x => x.id === id);
  if (!a) return;
  if (!confirm(`Delete the ad "${a.title || '(Untitled)'}" permanently?`)) return;
  DB.ads = DB.ads.filter(x => x.id !== id);
  saveDB();
  toast('Ad deleted.', 'success');
  render();
}

      <div class="cert-actions">
        <button type="button" class="btn btn-danger btn-sm" onclick="removeCertification(${i})">✕ Remove Certification</button>
      </div>
    </div>`;
  }).join('');
}

function addCertification(){
  if (settingsCerts.length >= 30) {
    toast('Maximum 30 certifications allowed.', 'error');
    return;
  }
  settingsCerts.push({
    id: uid(), title: '', issuer: '', date: '', description: '', image: ''
  });
  renderCertEditor();
  setTimeout(() => {
    const cards = document.querySelectorAll('#certEditor .cert-edit-card');
    const last = cards[cards.length - 1];
    const firstInput = last && last.querySelector('input.input');
    if (firstInput) firstInput.focus();
  }, 40);
}

function removeCertification(i){
  if (!confirm('Remove this certification? You still need to click Save Settings to apply the change.')) return;
  settingsCerts.splice(i, 1);
  renderCertEditor();
}

async function uploadCertImage(i, input){
  const file = input.files && input.files[0];
  if (!file) return;
  try {
    const data = await compressImage(file, 900, 0.82);
    settingsCerts[i].image = data;
    renderCertEditor();
    toast('Certification image added. Click Save Settings to apply.', 'success');
  } catch (e) { toast('Image upload failed.', 'error'); }
  input.value = '';
}

function clearCertImage(i){
  if (!settingsCerts[i]) return;
  settingsCerts[i].image = '';
  renderCertEditor();
  toast('Image removed. Click Save Settings to apply.', 'info');
}

async function uploadProfile(input){
  const file = input.files && input.files[0];
  if (!file) return;
  try {
    const data = await compressImage(file, 600, 0.85);
    const img = document.getElementById('settingsProfilePreview');
    img.src = data;
    img.dataset.dataurl = data;
    toast('Profile image ready. Click Save Settings to apply.', 'info');
  } catch (e) { toast('Upload failed.', 'error'); }
  input.value = '';
}
function clearProfileImage(){
  const img = document.getElementById('settingsProfilePreview');
  img.dataset.dataurl = '__CLEAR__';
  img.src = placeholderImage('Profile', 220);
  toast('Profile image will be removed after saving.', 'info');
}

async function saveSettings(e){
  e.preventDefault();
  const val = id => (document.getElementById(id)?.value || '').trim();
  const lines = id => val(id).split('\n').map(x => x.trim()).filter(Boolean);

  const s = DB.settings;
  s.siteName = val('sSiteName') || SITE_NAME;
  s.ownerName = val('sOwnerName') || 'Your Name';
  s.title = val('sTitle') || 'Data Entry Operator';
  s.tagline = val('sTagline');
  s.homeIntro = val('sHomeIntro');
  s.email = val('sEmail');
  s.phone = val('sPhone');
  s.aboutBio = val('sAboutBio');
  s.skills = lines('sSkills');
  s.services = lines('sServices');
  s.tools = lines('sTools');
  s.experience = lines('sExperience');
  s.seoTitle = val('sSeoTitle');
  s.seoDesc = val('sSeoDesc');
  s.footerText = val('sFooterText');
  s.social = {
    facebook: val('sFacebook'),
    linkedin: val('sLinkedin'),
    twitter: val('sTwitter'),
    github: val('sGithub'),
    whatsapp: val('sWhatsapp')
  };

  const cleanedCerts = (settingsCerts || [])
    .filter(c => c && String(c.title || '').trim())
    .map(c => ({
      id: c.id || uid(),
      title: String(c.title || '').trim().slice(0, 120),
      issuer: String(c.issuer || '').trim().slice(0, 80),
      date: String(c.date || '').trim().slice(0, 40),
      description: String(c.description || '').trim().slice(0, 300),
      image: c.image || ''
    }));
  s.certifications = cleanedCerts;

  const pImg = document.getElementById('settingsProfilePreview');
  if (pImg) {
    if (pImg.dataset.dataurl === '__CLEAR__') s.profileImage = '';
    else if (pImg.dataset.dataurl) s.profileImage = pImg.dataset.dataurl;
  }

  const newPass = document.getElementById('sNewPass')?.value || '';
  if (newPass) {
    if (newPass.length < 6) { toast('Password must be at least 6 characters.', 'error'); return false; }
    try {
      if (auth.currentUser) {
        await auth.currentUser.updatePassword(newPass);
        toast('Password updated successfully.', 'success');
      }
    } catch (err) {
      console.error('Password update failed:', err);
      if (err.code === 'auth/requires-recent-login') {
        toast('For security, please log out and log back in, then change the password.', 'error');
      } else {
        toast('Password update failed: ' + (err.message || err.code), 'error');
      }
      return false;
    }
  }

  saveDB();
  document.title = s.seoTitle || s.siteName;
  toast('Settings saved successfully.', 'success');
  render();
  return false;
}

function exportData(){
  const blob = new Blob([JSON.stringify(DB, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'portfolio-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('Backup downloaded.', 'success');
}
function importData(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json,.json';
  input.onchange = () => {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!parsed.posts || !parsed.settings) throw new Error('Invalid backup file');
        if (!confirm('Importing will replace all current data (including in Firebase). Continue?')) return;
        DB = normalizeDB(parsed);
        saveDB();
        toast('Data imported successfully.', 'success');
        render();
      } catch (err) { toast('Invalid backup file.', 'error'); }
    };
    reader.readAsText(file);
  };
  input.click();
}
async function resetData(){
  if (!confirm('⚠ This will DELETE all posts, media, messages, clients, reviews, ads, likes, followers, videos and settings from Firebase, and restore the demo content.\n\nContinue?')) return;
  if (!confirm('Are you absolutely sure? This cannot be undone.')) return;
  DB = seedDB();
  saveCache();
  try {
    await DB_REF.set(DB);
    toast('All data has been reset.', 'info');
  } catch (err) { toast('Reset failed: ' + err.message, 'error'); }
  location.hash = '#/admin/dashboard';
  render();
}

/* =====================================================================
   BOOTSTRAP
   ===================================================================== */

DB = loadCache() || seedDB();
migrateSiteName(DB);
saveCache();

document.title = (DB.settings && (DB.settings.seoTitle || DB.settings.siteName)) || SITE_NAME;

if (!location.hash || location.hash === '#') location.hash = '#/';
render();

scheduleAdShow(700);
window.addEventListener('hashchange', () => { scheduleAdShow(500); });
document.addEventListener('click', (e) => {
  const a = e.target && e.target.closest && e.target.closest('a[href^="#/"]');
  if (!a) return;
  const href = a.getAttribute('href') || '';
  if (href.indexOf('#/admin') === 0) return;
  scheduleAdShow(500);
}, true);

DB_REF.once('value').then(snap => {
  if (!snap.exists()) {
    return DB_REF.set(DB).then(() => DB);
  }
  return normalizeDB(snap.val());
}).then(remote => {
  if (!remote) return;
  const remoteStr = JSON.stringify(remote);
  const localStr = JSON.stringify(DB);
  DB = remote;
  saveCache();
  document.title = (DB.settings && (DB.settings.seoTitle || DB.settings.siteName)) || SITE_NAME;
  if (remoteStr !== localStr) render();
}).catch(err => { console.warn('Firebase initial sync skipped:', err); });

let firstRealtimeEvent = true;
DB_REF.on('value', (s) => {
  if (firstRealtimeEvent) { firstRealtimeEvent = false; return; }
  const val = s.val();
  if (!val) return;
  const remoteStr = JSON.stringify(val);
  const localStr = JSON.stringify(DB);
  DB = normalizeDB(val);
  saveCache();
  document.title = (DB.settings && (DB.settings.seoTitle || DB.settings.siteName)) || SITE_NAME;
  if (remoteStr !== localStr) render();
});

auth.onAuthStateChanged(() => { if (DB) render(); });

window.addEventListener('focus', () => {
  const { segs } = parseHash();
  if (segs[0] === 'admin' && !isLoggedIn() && segs.length > 1) {
    location.hash = '#/admin';
  }
});
